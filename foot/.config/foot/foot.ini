[main]
include=~/.config/foot/themes/noctalia

shell=fish
title=foot
font=MartianMono Nerd Font:size=10
letter-spacing=0
dpi-aware=no
pad=12x12
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

[colors-dark]
alpha=0.78
alpha-mode=matching
blur=yes

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
